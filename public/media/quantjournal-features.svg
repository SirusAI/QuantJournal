<g fill="#94a3b8" font-size="17"><text x="85" y="302">Use stock fills, with each execution row.</text><text x="550" y="302">Map fields and convert to New York time.</text><text x="1015" y="302">Reconcile imported P&amp;L with the report.</text></g>
