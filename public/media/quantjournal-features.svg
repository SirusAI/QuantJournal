<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
<title id="title">QuantJournal — from broker executions to better reviews</title>
<desc id="desc">Export broker fills, prepare the CSV template, import trades, explore Dashboard, Calendar and Reports, then write Journal notes and generate Daily Review or AI Coach analysis. The public demo uses fictional data and simulated AI.</desc>
